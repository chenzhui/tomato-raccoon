<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Background Studio Box -->
  <rect width="600" height="600" fill="#F4EFE6" rx="28"/>

  <!-- TOTE BAG ILLUSTRATION -->
  <g transform="translate(130, 70)">
    <!-- Straps / Handles -->
    <path d="M 90 200 C 90 5 250 5 250 200" fill="none" stroke="#1E3F20" stroke-width="26" stroke-linecap="round"/>
    <path d="M 90 200 C 90 10 250 10 250 200" fill="none" stroke="#2D5A27" stroke-width="20" stroke-linecap="round"/>

    <!-- Bag Body (Natural heavy cotton duck canvas) -->
    <path d="M 40 180 L 300 180 L 325 450 C 325 470 310 485 290 485 L 50 485 C 30 485 15 470 15 450 Z" 
          fill="#FAF6ED" stroke="#D3C7B2" stroke-width="4" filter="drop-shadow(0 18px 25px rgba(0,0,0,0.12))"/>
    <!-- Fold and Stitch Lines -->
    <line x1="40" y1="210" x2="300" y2="210" stroke="#C5B7A0" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M 90 180 L 90 230 M 250 180 L 250 230" stroke="#1E3F20" stroke-width="4"/>

    <!-- Screen Printed Tomato Raccoon on Tote -->
    <g transform="translate(170, 330) scale(0.38)">
      <circle cx="0" cy="0" r="220" fill="#1E3F20"/>
      <circle cx="0" cy="0" r="160" fill="#FAF7F0"/>
      <!-- Tomato -->
      <circle cx="0" cy="65" r="70" fill="#D93829"/>
      <path d="M 0 0 L -6 -15 L 6 -15 Z" fill="#2D5A27"/>
      <!-- Raccoon head -->
      <ellipse cx="0" cy="-40" rx="55" ry="42" fill="#6B6661"/>
      <path d="M -40 -45 Q 0 -55 40 -45 Q 25 -25 0 -35 Q -25 -25 -40 -45 Z" fill="#201E1D"/>
      <circle cx="-18" cy="-40" r="5" fill="#FFF"/>
      <circle cx="18" cy="-40" r="5" fill="#FFF"/>
      <!-- Text around print -->
      <text x="0" y="-120" font-family="'Georgia', serif" font-size="28" font-weight="900" fill="#FAF7F0" text-anchor="middle" letter-spacing="3">GROW TOMATOES</text>
      <text x="0" y="170" font-family="'Georgia', serif" font-size="20" font-weight="800" fill="#E8B923" text-anchor="middle" letter-spacing="2">NOT DATA CENTERS</text>
    </g>

    <!-- Side Organic Fabric Label Tag -->
    <rect x="296" y="270" width="22" height="40" rx="3" fill="#D93829"/>
    <text x="307" y="295" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFF" text-anchor="middle" transform="rotate(90, 307, 295)">100% ORGANIC</text>
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="30" width="180" height="34" rx="8" fill="#1E3F20"/>
  <text x="120" y="52" font-family="'Georgia', serif" font-size="12" font-weight="bold" fill="#FAF7F0" text-anchor="middle" letter-spacing="1">12oz HEAVY CANVAS</text>
</svg>
