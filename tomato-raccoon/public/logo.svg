<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="rustic-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.12"/>
    </filter>
    <path id="text-top-arc" d="M 65 250 A 185 185 0 0 1 435 250" fill="none" />
    <path id="text-bottom-arc" d="M 425 250 A 175 175 0 0 1 75 250" fill="none" />
  </defs>

  <!-- Outer Weathered Badge Circle -->
  <circle cx="250" cy="250" r="240" fill="#FAF7F0" stroke="#1E3F20" stroke-width="12" filter="url(#rustic-shadow)"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="#D93829" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="250" cy="250" r="220" fill="#1E3F20" />

  <!-- Circular Arch Text -->
  <text font-family="'Georgia', serif" font-size="28" font-weight="900" fill="#FAF7F0" letter-spacing="4">
    <textPath href="#text-top-arc" startOffset="50%" text-anchor="middle">
      GROW TOMATOES
    </textPath>
  </text>
  <text font-family="'Georgia', serif" font-size="22" font-weight="800" fill="#E8B923" letter-spacing="3.5">
    <textPath href="#text-bottom-arc" startOffset="50%" text-anchor="middle">
      ★ NOT DATA CENTERS ★
    </textPath>
  </text>

  <!-- Inner Cream Heritage Disc -->
  <circle cx="250" cy="250" r="162" fill="#F4EFE6" stroke="#2B2824" stroke-width="4"/>
  <circle cx="250" cy="250" r="154" fill="none" stroke="#7C5335" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Sunburst Farm Rays Background -->
  <g opacity="0.15" stroke="#7C5335" stroke-width="2">
    <line x1="250" y1="250" x2="160" y2="120"/>
    <line x1="250" y1="250" x2="210" y2="105"/>
    <line x1="250" y1="250" x2="250" y2="100"/>
    <line x1="250" y1="250" x2="290" y2="105"/>
    <line x1="250" y1="250" x2="340" y2="120"/>
  </g>

  <!-- RACCOON BODY & HEAD -->
  <!-- Fluffy Ears -->
  <path d="M 180 155 Q 165 110 195 125 Q 215 140 205 165 Z" fill="#4A4744" stroke="#2B2824" stroke-width="4"/>
  <path d="M 183 150 Q 175 120 195 132 Z" fill="#F4EFE6"/>
  <path d="M 320 155 Q 335 110 305 125 Q 285 140 295 165 Z" fill="#4A4744" stroke="#2B2824" stroke-width="4"/>
  <path d="M 317 150 Q 325 120 305 132 Z" fill="#F4EFE6"/>

  <!-- Straw Garden Hat -->
  <ellipse cx="250" cy="155" rx="82" ry="24" fill="#DDBB66" stroke="#2B2824" stroke-width="4.5"/>
  <path d="M 210 152 Q 220 115 250 115 Q 280 115 290 152 Z" fill="#CCAA55" stroke="#2B2824" stroke-width="4"/>
  <path d="M 210 148 Q 250 154 290 148" stroke="#D93829" stroke-width="6" fill="none"/>

  <!-- Head Outline -->
  <ellipse cx="250" cy="205" rx="68" ry="58" fill="#75706B" stroke="#2B2824" stroke-width="4.5"/>

  <!-- Iconic Black Bandit Mask -->
  <path d="M 190 198 Q 220 186 250 196 Q 280 186 310 198 Q 305 224 285 220 Q 250 208 215 220 Q 195 224 190 198 Z" fill="#242220" stroke="#1A1A1A" stroke-width="2"/>

  <!-- White Cheek Fur Highlights -->
  <path d="M 184 212 Q 196 238 226 236 Q 200 248 184 232 Z" fill="#FAF7F0"/>
  <path d="M 316 212 Q 304 238 274 236 Q 300 248 316 232 Z" fill="#FAF7F0"/>

  <!-- Expressive Eyes -->
  <circle cx="222" cy="204" r="8.5" fill="#FAF7F0"/>
  <circle cx="222" cy="204" r="6" fill="#1A1A1A"/>
  <circle cx="224" cy="202" r="2.5" fill="#FFFFFF"/>
  <circle cx="278" cy="204" r="8.5" fill="#FAF7F0"/>
  <circle cx="278" cy="204" r="6" fill="#1A1A1A"/>
  <circle cx="280" cy="202" r="2.5" fill="#FFFFFF"/>

  <!-- White Snout and Cute Nose -->
  <ellipse cx="250" cy="225" rx="19" ry="14" fill="#FAF7F0" stroke="#2B2824" stroke-width="2.5"/>
  <path d="M 244 219 Q 250 216 256 219 Q 250 227 244 219 Z" fill="#242220"/>
  <line x1="250" y1="225" x2="250" y2="232" stroke="#2B2824" stroke-width="2"/>
  <path d="M 243 230 Q 250 235 257 230" fill="none" stroke="#2B2824" stroke-width="2"/>

  <!-- Whiskers -->
  <line x1="205" y1="224" x2="175" y2="220" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="205" y1="229" x2="178" y2="233" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="295" y1="224" x2="325" y2="220" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="295" y1="229" x2="322" y2="233" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- THE GIANT HEIRLOOM RED TOMATO (Hugged with love) -->
  <g>
    <!-- Tomato Shadow -->
    <ellipse cx="250" cy="336" rx="76" ry="14" fill="#2B2824" opacity="0.25"/>

    <!-- Plump Ripe Red Tomato -->
    <path d="M 250 250 C 190 250 180 295 184 330 C 188 360 215 375 250 375 C 285 375 312 360 316 330 C 320 295 310 250 250 250 Z" 
          fill="#D93829" stroke="#8A1E14" stroke-width="4.5"/>
    <!-- Tomato Highlight Arc -->
    <path d="M 210 280 Q 200 310 215 340" fill="none" stroke="#F46658" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

    <!-- Green Calyx Leaf Crown -->
    <path d="M 250 256 L 244 240 L 250 248 L 260 238 L 254 254 L 268 256 L 253 262 L 258 274 L 248 264 L 238 272 L 245 260 L 232 254 Z" 
          fill="#2D5A27" stroke="#1A3816" stroke-width="3"/>
    <!-- Curved Tomato Stem -->
    <path d="M 250 248 Q 248 232 258 226" fill="none" stroke="#2D5A27" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Paws Clamping the Tomato -->
  <!-- Left Paw -->
  <ellipse cx="198" cy="286" rx="16" ry="14" fill="#4A4744" stroke="#2B2824" stroke-width="3.5"/>
  <circle cx="190" cy="282" r="3.5" fill="#242220"/>
  <circle cx="196" cy="277" r="3.5" fill="#242220"/>
  <circle cx="203" cy="278" r="3.5" fill="#242220"/>
  <!-- Right Paw -->
  <ellipse cx="302" cy="286" rx="16" ry="14" fill="#4A4744" stroke="#2B2824" stroke-width="3.5"/>
  <circle cx="310" cy="282" r="3.5" fill="#242220"/>
  <circle cx="304" cy="277" r="3.5" fill="#242220"/>
  <circle cx="297" cy="278" r="3.5" fill="#242220"/>

  <!-- Vintage Banner Ribbon at Bottom -->
  <g transform="translate(0, 10)">
    <path d="M 120 405 L 380 405 L 370 435 L 130 435 Z" fill="#2B2824"/>
    <rect x="125" y="400" width="250" height="32" rx="4" fill="#FAF7F0" stroke="#1E3F20" stroke-width="3"/>
    <text x="250" y="422" font-family="'Georgia', serif" font-size="13" font-weight="900" fill="#1E3F20" text-anchor="middle" letter-spacing="2">
      DEFEND VIRGINIA FARMLAND
    </text>
  </g>
</svg>
